<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1015" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="A personal wiki, knowledge graph and life OS. Data stays in your browser." />
    <title>Atlas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint, so a paper-theme user never sees a dark flash.
      // If a host page already chose a theme (the artifact viewer does), leave its choice alone.
      try {
        var t = JSON.parse(localStorage.getItem('atlas:theme') || 'null')
        if (t && !document.documentElement.dataset.theme) {
          document.documentElement.dataset.theme = t.theme
          document.documentElement.dataset.accent = t.accent
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
